[project]
name = "my-study-hud"
version = "0.1.0"
description = "Minimal FastAPI RAG scaffold"
requires-python = ">=3.11"
dependencies = [
  "bs4>=0.0.2",
  "chromadb>=1.5.9",
  "easyocr>=1.7.2",
  "faiss-cpu>=1.15.0",
  "fastapi[standard]>=0.115.0",
  "google-genai>=2.17.0",
  "langchain>=1.3.15",
  "langchain-community>=0.4.2",
  "langchain-huggingface>=1.2.2",
  "langchain-text-splitters>=1.1.2",
  "pdfplumber>=0.11.10",
  "pillow>=12.3.0",
  "pydantic>=2.13.4",
  "pymupdf>=1.28.0",
  "pypdf>=6.15.0",
  "pytesseract>=0.3.13",
  "python-dotenv>=1.2.2",
  "python-pptx>=1.0.2",
  "rapidocr-onnxruntime>=1.4.4",
  "sentence-transformers>=5.6.1",
  "tesseract>=0.1.3",
  "torch",
  "torchvision",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
